# Curvature-aware locomotion in the existing discrete foraging simulator.
# The brain still chooses heading actions. A local 3x3 odor stencil estimates
# odor-field geometry and continuously slows translation in highly curved areas.

seed: 42
max_steps: 500
body_length: 2

brain:
  name: mlpreinforce
  config:
    hidden_dim: 64
    learning_rate: 0.001
    num_hidden_layers: 2
    use_curvature_features: true
    curvature_feature_scale: 0.5

reward:
  reward_goal: 2.0
  reward_distance_scale: 0.5
  reward_exploration: 0.05
  penalty_step: 0.005
  penalty_anti_dithering: 0.02
  penalty_stuck_position: 0.0
  stuck_position_threshold: 0

satiety:
  initial_satiety: 200.0
  satiety_decay_rate: 1.0
  satiety_gain_per_food: 0.2

environment:
  grid_size: 30
  viewport_size: [11, 11]
  curvature_navigation:
    enabled: true
    use_local_gradient_state: true
    sensing_spacing: 1.0
    min_speed: 0.2
    max_speed: 1.0
    curvature_scale: 0.5
    curvature_exponent: 2.0
    gradient_floor: 0.000001
  foraging:
    foods_on_grid: 8
    target_foods_to_collect: 12
    min_food_distance: 4
    agent_exclusion_radius: 5
    gradient_decay_constant: 8.0
    gradient_strength: 1.0

gradient:
  method: clip
